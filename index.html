<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>FIASKO – Fördern, feiern, feuern (Testversion)</title>
<style>
  :root{
    --bg:#f7dfe1; --ink:#1c1411; --brown:#3b2520; --orange:#d9532a; --white:#fff;
    --slab:Rockwell,"Rockwell Nova","Roboto Slab","Bookman Old Style",Georgia,serif;
    --sans:"Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:linear-gradient(#f9e6e7,#f4d3d7);background-attachment:fixed;background-color:var(--bg);
    color:var(--ink);font-family:var(--sans);font-size:1.05rem;line-height:1.5;
    padding-bottom:max(30px,env(safe-area-inset-bottom));min-height:100vh;
  }
  .bar{background:var(--brown);color:#fff;padding:max(12px,env(safe-area-inset-top)) 16px 12px}
  .bar .firm{font-family:var(--slab);font-weight:800;font-size:1.2rem}
  .bar .dept{font-size:.85rem;color:#e8d6cf}
  .wrap{max-width:560px;margin:0 auto;padding:0 16px}
  h1,h2,h3{font-family:var(--slab);font-weight:800;line-height:1.1;margin:0}
  h1{font-size:2.3rem;margin:24px 0 10px}
  h1 small{display:block;font-family:var(--sans);font-weight:600;font-size:1rem;margin-bottom:6px;color:#7a4a3d}
  p{margin:0 0 12px}
  .fine{font-size:.92rem;color:#5b4640}
  a{color:inherit;text-underline-offset:2px}
  button,.btn{
    font:700 1.05rem var(--sans);cursor:pointer;border:0;border-radius:999px;
    background:var(--orange);color:#fff;padding:15px 20px;width:100%;display:block;
    text-align:center;text-decoration:none;
  }
  button:hover,.btn:hover{filter:brightness(.93)}
  button:focus-visible,.btn:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--brown);outline-offset:3px}
  button.ghost{background:transparent;color:var(--brown);border:2px solid var(--brown)}
  .gallery{
    display:none;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;
    margin:14px -16px 18px;padding:0 16px 6px;-webkit-overflow-scrolling:touch;
  }
  .gallery img{height:240px;width:auto;flex:0 0 auto;border-radius:12px;scroll-snap-align:start;display:block}
  .tiles{display:flex;flex-direction:column;gap:12px;margin-top:22px}
  .tile{border-radius:16px;box-shadow:0 3px 8px rgba(60,30,25,.22)}
  .tile summary{list-style:none;cursor:pointer;padding:18px 18px 16px;display:block}
  .tile summary::-webkit-details-marker{display:none}
  .tile h2{font-size:1.9rem;margin-bottom:8px}
  .tile .desc{margin:0 0 14px;font-size:1.05rem}
  .foot{display:flex;align-items:flex-end;justify-content:space-between}
  .foot img{height:104px;width:auto;display:block}
  .plus{
    width:58px;height:58px;border-radius:50%;background:var(--orange);color:#fff;
    font:700 2.1rem/58px var(--sans);text-align:center;flex:0 0 auto;transition:transform .2s;
  }
  .tile[open] .plus{transform:rotate(45deg)}
  .tbody{padding:0 18px 20px}
  .tbody ul{margin:0 0 10px;padding-left:1.1em}
  .tbody li{margin:0 0 6px}
  .tbody b{font-family:var(--slab)}
  .tbody .course{margin:0 0 12px}
  .tile.dark{color:#fff}
  .tile.dark .tbody a.btn{background:#fff;color:#3b1747;margin:0 0 8px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 18px}
  .name{
    background:#fff;color:var(--brown);border:3px solid var(--brown);border-radius:14px;
    padding:18px 10px;font:800 1.15rem var(--slab);
  }
  .name:hover{background:#fff3ec;filter:none}
  .trust{background:#fff;border-left:6px solid var(--orange);border-radius:8px;padding:10px 12px;margin:12px 0 0;font-size:1rem}
  .warn{background:#fff;border-left:6px solid var(--brown);border-radius:8px;padding:10px 12px;margin:14px 0 20px}
  .back{margin-top:20px}
  .rolecard{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 3px 10px rgba(60,30,25,.22);margin:12px 0 14px}
  .photo{display:block;width:100%;height:auto}
  .rbody{padding:6px 18px 18px;background:linear-gradient(#f6ece3,#f0e3d6)}
  .rbody h2{font:900 2.1rem/1.02 var(--sans);letter-spacing:-.01em;margin:8px 0 4px}
  .rbody .age{margin:0 0 12px;font-size:1.05rem}
  .rbody .text{margin:0;font-size:1.1rem}
  .cost{background:#d2c3b0;padding:14px 18px 16px}
  .cost h3{font-size:1.25rem;margin-bottom:6px}
  .cost p{margin:0}
  @media (prefers-reduced-motion:no-preference){
    .rolecard{animation:open .3s ease-out}
    @keyframes open{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  }
</style>
</head>

  var DATA = "9JyapxWYtJCI6Iycl5mbhhkIgwiIyF2Yz9mIgojI2FGdzV3RiACLi4Wa2V2aiAiOigXasVmRiACLiMXYpJ2b0JCI6ICbp1WRiACLiUGZpVGaiAiOiEmbhRkIgwiIhJ3buJCI6ISYyFGbDJCIsISYtl2cvNmIgojIhxGblJkIgwiIhxWahxmIgojIh5mbBJye";

  var assign = {};
  try{ assign = JSON.parse(atob(DATA.split("").reverse().join(""))); }catch(e){}

  var view = "home", current = null;
  var app = document.getElementById("app");

  function roleById(id){
    for(var i = 0; i < ROLES.length; i++){ if(ROLES[i].id === id) return ROLES[i]; }
  }
  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];
    });
  }
  function link(t, u){ return '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(t) + '</a>'; }
  function galleryUrl(f){
    return SITE + "_next/image?url=%2F_next%2Fstatic%2Fimmutable%2Fmedia%2F" + f + "&w=1080&q=75";
  }
  window.__gal = function(img){ img.parentNode.style.display = "flex"; };
  window.__hide = function(img){ img.style.display = "none"; };

  /* ---------- Ansichten ---------- */
  function tile(key, title, desc, inner, dark){
    return '<details class="tile' + (dark ? ' dark' : '') + '" style="background:' + ASSETS.tiles[key] + '">' +
      '<summary><h2>' + esc(title) + '</h2><p class="desc">' + esc(desc) + '</p>' +
      '<div class="foot"><img src="' + ASSETS.icons[key] + '" alt=""><span class="plus" aria-hidden="true">+</span></div></summary>' +
      '<div class="tbody">' + inner + '</div></details>';
  }

  function renderHome(){
    var gal = GALLERY.map(function(f, i){
      return '<img referrerpolicy="no-referrer" src="' + galleryUrl(f) + '" alt="Bild ' + (i + 1) + ' zum Krimidinner" loading="lazy" onload="__gal(this)" onerror="__hide(this)">';
    }).join("");

    var menu = MENU.map(function(c){
      return '<div class="course"><b>' + esc(c.course) + '</b><ul>' +
        c.items.map(function(i){ return '<li>' + link(i.t, i.u) + '</li>'; }).join("") + '</ul></div>';
    }).join("");
    var deco = '<ul>' + DECO.map(function(d){ return '<li>' + esc(d) + '</li>'; }).join("") + '</ul>';
    var cost = '<p>Bei deiner Rolle steht ein Kostümvorschlag, wie dein Outfit aussehen könnte. Niemand muss sich verkleiden, aber es macht mehr Spaß.</p>' +
      '<p class="fine" style="color:inherit;margin:0">Weitere Ideen vom Verlag: ' + link("Kostümvorschläge als PDF", COSTUME_PDF) + ' und ' + link("die Spielseite", GAME_URL) + '.</p>';
    var music = '<p class="fine" style="color:inherit">Die Links öffnen eine Suche auf Spotify. Such dir dort eine Playlist aus, die dir gefällt.</p>' +
      MUSIC.map(function(m){ return '<a class="btn" href="' + esc(m.u) + '" target="_blank" rel="noopener">' + esc(m.t) + '</a>'; }).join("");

    app.innerHTML =
      '<h1><small>Das Krimidinner für Zuhause</small>Fördern, feiern, feuern</h1>' +
      '<p>Freitagnachmittag bei der FIASKO-Versicherung: Hans Sachs lädt zum Geburtstagsumtrunk ins Büro. Doch am Ende der Feier fehlt das Geburtstagskind, und im Büro wartet eine Leiche.</p>' +
      '<div class="gallery">' + gal + '</div>' +
      '<button id="go">Meine Rolle ansehen</button>' +
      '<div class="tiles">' +
        tile("rezepte", "Rezepte", "Von Aperitif bis Alibi: Menüideen für euren Abend.", menu, false) +
        tile("kostueme", "Kostüme", "Mach deinen Auftritt unvergesslich.", cost, false) +
        tile("deko", "Dekoration", "So wird euer Zuhause zur Kulisse.", deco, false) +
        tile("musik", "Musik", "Trommelwirbel: der Soundtrack für den Abend.", music, true) +
      '</div>';
    document.getElementById("go").onclick = function(){ view = "pick"; render(); window.scrollTo(0, 0); };
  }

  function renderPick(){
    app.innerHTML =
      '<h1 style="font-size:2rem">Wer bist du?</h1>' +
      '<div class="trust">Das läuft auf Vertrauensbasis: Tippe bitte nur deinen eigenen Namen an. Wer bei anderen nachschaut, sieht deren Rolle und nimmt sich und ihnen den Spaß.</div>' +
      '<div class="grid">' +
        PLAYERS.map(function(p){ return '<button class="name" data-n="' + esc(p.name) + '">' + esc(p.name) + '</button>'; }).join("") +
      '</div>' +
      '<p class="fine">Deine Rolle bleibt bis zum Abend geheim.</p>' +
      '<button id="home" class="ghost back">Zurück zur Startseite</button>';
    Array.prototype.forEach.call(app.querySelectorAll(".name"), function(b){
      b.onclick = function(){ current = b.getAttribute("data-n"); view = "confirm"; render(); window.scrollTo(0, 0); };
    });
    document.getElementById("home").onclick = function(){ view = "home"; render(); window.scrollTo(0, 0); };
  }

  function renderConfirm(){
    app.innerHTML =
      '<h1 style="font-size:2rem"><small>Kurze Nachfrage</small>Bist du ' + esc(current) + '?</h1>' +
      '<div class="warn">Sieh nur deine eigene Rolle an. Wenn jemand neben dir sitzt, bitte kurz wegschauen lassen.</div>' +
      '<button id="show" style="margin-bottom:10px">Ja, Rolle aufdecken</button>' +
      '<button id="back" class="ghost">Nein, zurück</button>';
    document.getElementById("show").onclick = function(){ view = "card"; render(); window.scrollTo(0, 0); };
    document.getElementById("back").onclick = function(){ view = "pick"; render(); };
  }

  function renderCard(){
    var r = roleById(assign[current]);
    if(!r){
      app.innerHTML = '<h1 style="font-size:2rem">Hoppla</h1><p>Für diesen Namen wurde keine Rolle gefunden. Sag bitte Melli Bescheid.</p><button id="back">Zurück</button>';
      document.getElementById("back").onclick = function(){ view = "pick"; render(); };
      return;
    }
    var a = ASSETS.roles[r.id];
    var cost = COSTUMES[r.id]
      ? '<div class="cost"><h3>So könnte dein Outfit aussehen</h3><p>' + esc(COSTUMES[r.id]) + '</p><p class="fine" style="margin:8px 0 0">Das ist nur ein Kostümvorschlag, du bist völlig frei.</p></div>'
      : '';
    app.innerHTML =
      '<p style="margin:18px 0 0">Hallo ' + esc(current) + ', das ist deine Rolle:</p>' +
      '<div class="rolecard">' +
        '<img class="photo" src="' + a.img + '" alt="Bild von ' + esc(r.name) + '" style="background:linear-gradient(' + a.bg[0] + ',' + a.bg[1] + ')">' +
        '<div class="rbody"><h2>' + esc(r.name) + '</h2><p class="age">' + r.age + ' Jahre</p><p class="text">' + esc(r.text) + '</p></div>' +
        cost +
      '</div>' +
      '<p class="fine">Merk dir alles gut. Die Rolle bleibt geheim, bis das Spiel beginnt.</p>' +
      '<button id="close">Karte schließen</button>';
    document.getElementById("close").onclick = function(){ current = null; view = "pick"; render(); window.scrollTo(0, 0); };
  }

  function render(){
    if(view === "pick") renderPick();
    else if(view === "confirm") renderConfirm();
    else if(view === "card") renderCard();
    else renderHome();
  }
  render();
})();
